name: Docker Images (Two-Layer)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "上游 CyberStrikeAI 版本 (Tools 镜像 tools/*.yaml 来源)"
        required: false
        default: "v1.7.11"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Tools 基础镜像（独立，不依赖主程序源码）----
  tools:
    runs-on: ubuntu-latest
    # 手动触发 或 install-tools.sh 有变更时才构建
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free up disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          docker image prune -af || true
          echo "After:"; df -h /

      - name: Prepare image metadata
        id: prep
        shell: bash
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/offsec-tools" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.upstream_version || 'v1.7.11' }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and publish Tools image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.tools
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          platforms: linux/amd64
          build-args: |
            tools_version=${{ inputs.upstream_version || 'v1.7.11' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=tools

      - name: Verify Tools image
        if: github.event_name != 'pull_request'
        run: |
          echo "Pulling image for verification (GHA cache makes this fast)..."
          docker pull ${{ steps.prep.outputs.image }}:latest
          echo "=== Smoke tests ==="
          docker run --rm ${{ steps.prep.outputs.image }}:latest sh -c '
            set -e
            fail=0

            # 语言运行时
            for bin in python3 php go ruby gem node npm java; do
              if command -v "$bin" >/dev/null 2>&1; then
                echo "OK  $bin: $(command -v $bin)"
              else
                echo "FAIL $bin: not found"; fail=1
              fi
            done

            # 安全工具二进制
            for bin in nmap nuclei katana subfinder feroxbuster fscan gau dirsearch; do
              if command -v "$bin" >/dev/null 2>&1; then
                echo "OK  $bin: $(command -v $bin)"
              else
                echo "FAIL $bin: not found"; fail=1
              fi
            done

            # Python 关键依赖（注意: pip 包名 ≠ import 名）
            for pkg in requests httpx scapy paramiko \
                        Crypto lxml colorama \
                        yara lief volatility3 frida; do
              if python3 -c "import $pkg" 2>/dev/null; then
                echo "OK  import $pkg"
              else
                echo "FAIL import $pkg"; fail=1
              fi
            done
            # import 名与 pip 包名不同的包
            for pair in \
              "dns.resolver:dnspython" \
              "nmap:python-nmap" \
              "bs4:beautifulsoup4" \
              "jwt:pyjwt" \
              "websocket:websocket-client" \
              "yaml:pyyaml" \
              "keystone:keystone-engine" \
              "objection:objection" \
              "boofuzz:boofuzz" \
              "defang:defang" \
              "netaddr:netaddr"; do
              mod="${pair%%:*}"
              name="${pair##*:}"
              if python3 -c "import $mod" 2>/dev/null; then
                echo "OK  import $mod ($name)"
              else
                echo "FAIL import $mod ($name)"; fail=1
              fi
            done

            # PHP 可用性
            if php -v 2>/dev/null | head -1; then
              echo "OK  php -v"
            else
              echo "FAIL php -v"; fail=1
            fi

            if [ $fail -ne 0 ]; then
              echo "=== VERIFICATION FAILED ==="
              exit 1
            fi
            echo "=== ALL CHECKS PASSED ==="
          '

  # ---- App 主程序镜像（依赖 Tools 基础镜像）----
  app:
    runs-on: ubuntu-latest
    needs: tools
    if: always() && !cancelled()
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free up disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          docker image prune -af || true
          echo "After:"; df -h /

      - name: Prepare image metadata
        id: prep
        shell: bash
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "tools_image=ghcr.io/${owner}/offsec-tools" >> "${GITHUB_OUTPUT}"
          echo "app_image=ghcr.io/${owner}/cyberstrikeai" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prep.outputs.app_image }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and publish App image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.app
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          platforms: linux/amd64
          build-args: |
            TOOLS_IMAGE=${{ steps.prep.outputs.tools_image }}:latest
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
